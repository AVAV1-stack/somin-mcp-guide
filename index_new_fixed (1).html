<!DOCTYPE html>
<html lang="en">
<head>

<title>SOMIN — Claude MCP Connection Guide</title>

<style>
  :root {

    --shadow-md: 0 4px 16px rgba(10,37,64,.08);
    --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px;
    --font: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: var(--font); color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; line-height: 1.55; font-size: 16px; }
  .somin-app { display: flex; flex-direction: column; max-width: 1400px; margin: 0 auto; background: var(--white); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-md); min-height: 760px; }
  .topbar { background: var(--navy); color: rgba(255,255,255,.92); padding: 18px 32px; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 28px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark { width: 38px; height: 38px; border-radius: 10px; background: var(--teal); color: var(--navy); display: grid; place-items: center; font-weight: 800; font-size: 19px; letter-spacing: -0.5px; }

  .brand-name { font-weight: 800; font-size: 17px; letter-spacing: 0.5px; color: var(--white); }
  .brand-tag { font-size: 10.5px; color: rgba(255,255,255,.55); margin-top: 3px; letter-spacing: 0.8px; text-transform: uppercase; font-weight: 600; }
  .stepper { display: flex; align-items: center; justify-content: center; list-style: none; margin: 0; padding: 0; flex: 1; max-width: 620px; justify-self: center; }
  .stepper-item { flex: 1; display: flex; align-items: center; position: relative; }
  .stepper-dot { width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,.08); border: 2px solid transparent; color: rgba(255,255,255,.7); display: grid; place-items: center; font-size: 11px; font-weight: 700; cursor: pointer; transition: all .2s; position: relative; z-index: 2; flex-shrink: 0; font-family: var(--font); padding: 0; }
  .stepper-dot:hover { background: rgba(255,255,255,.16); color: #fff; transform: scale(1.08); }
  .stepper-item.active .stepper-dot { background: var(--teal); color: var(--navy); box-shadow: 0 0 0 4px rgba(8,164,165,.25); transform: scale(1.1); }
  .stepper-item.complete .stepper-dot { background: var(--teal); color: var(--navy); }
  .stepper-item.complete .num-text { display: none; }
  .stepper-item .checkmark { display: none; }
  .stepper-item.complete .checkmark { display: block; }
  .stepper-line { flex: 1; height: 2px; background: rgba(255,255,255,.1); position: relative; overflow: hidden; }
  .stepper-line::after { content: ''; position: absolute; inset: 0; background: var(--teal); transform: scaleX(0); transform-origin: left; transition: transform .35s ease; }
  .stepper-item.complete .stepper-line::after { transform: scaleX(1); }
  .stepper-item:last-child .stepper-line { display: none; }
  .stepper-dot::before { content: attr(data-label); position: absolute; top: calc(100% + 8px); left: 50%; transform: translateX(-50%); background: rgba(255,255,255,.95); color: var(--navy); padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .15s; z-index: 10; box-shadow: 0 4px 12px rgba(0,0,0,.2); }
  .stepper-dot:hover::before { opacity: 1; }
  .top-progress { display: flex; align-items: center; gap: 12px; color: rgba(255,255,255,.85); font-size: 12px; font-weight: 600; }
  .top-progress strong { color: var(--teal); font-weight: 800; font-size: 14px; }
  .canvas { flex: 1; overflow-y: auto; background: radial-gradient(circle at 90% 0%, rgba(8,164,165,.05), transparent 50%), var(--white); }
  .canvas-inner { padding: 44px 56px 32px; max-width: 1280px; margin: 0 auto; }

  .phase-counter::before { content: ''; width: 6px; height: 6px; background: var(--teal); border-radius: 50%; }
  h1 { font-size: 34px; line-height: 1.15; color: var(--navy); font-weight: 800; letter-spacing: -0.6px; margin: 8px 0 16px; }
  h2 { text-transform: uppercase; font-size: 12px; letter-spacing: 1.4px; color: var(--teal-dark); font-weight: 700; margin: 20px 0 12px; }
  .intro { font-size: 16px; color: var(--ink-2); line-height: 1.65; margin: 0 0 18px; max-width: 65ch; }
  .phase-figure { margin: 24px 0 16px; padding: 0; }
  .phase-figure--multi { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; width: 90%; margin: 0 auto; align-items: start; }
  .phase-figure--multi figure { margin: 0; }
  .phase-figure-frame { border: 1px solid var(--line); border-radius: var(--radius-md); overflow: hidden; background: #F8FAFC; box-shadow: var(--shadow-md); position: relative; }
  .phase-figure-frame::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 24px; background: linear-gradient(to bottom, rgba(10,37,64,.04), transparent); pointer-events: none; z-index: 1; }
  .phase-figure img { display: block; width: 100%; height: auto; }
  .phase-figcaption { font-size: 13px; color: var(--muted); text-align: center; margin-top: 12px; line-height: 1.5; font-style: italic; padding: 0 24px; }
  .phase-figcaption strong { color: var(--teal-dark); font-style: normal; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; font-size: 11px; margin-right: 6px; background: var(--teal-soft); padding: 3px 9px; border-radius: 999px; }
  .phase-grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 40px; margin-top: 16px; align-items: start; }
  .intro a, .step-text a, .callout-body a { color: var(--teal-dark); font-weight: 700; text-decoration: none; border-bottom: 1.5px solid var(--teal-border); transition: border-color .15s, background .15s, color .15s; padding: 0 1px; }
  .intro a:hover, .step-text a:hover, .callout-body a:hover { border-bottom-color: var(--teal); background: var(--teal-soft); color: var(--navy); }
  .deep-link-btn { display: inline-flex; align-items: center; gap: 6px; background: var(--teal); color: var(--white) !important; border: none !important; border-bottom: none !important; padding: 7px 16px; border-radius: 999px; font-size: 13px; font-weight: 700; text-decoration: none; transition: background .15s, transform .1s, box-shadow .15s; box-shadow: 0 2px 8px rgba(8,164,165,.3); cursor: pointer; }
  .deep-link-btn:hover { background: var(--teal-dark) !important; color: var(--white) !important; border-bottom: none !important; box-shadow: 0 4px 14px rgba(8,164,165,.4); transform: translateY(-1px); }

  .copy-btn:hover { background: var(--teal-soft); border-color: var(--teal-border); color: var(--teal-dark); }

  .steps { margin: 6px 0 0; list-style: none; padding: 0; }
  .step { display: flex; gap: 14px; padding: 13px 16px; background: var(--white); border: 1px solid var(--line); border-radius: var(--radius-md); margin-bottom: 8px; cursor: pointer; transition: border-color .15s, background .15s, transform .1s; align-items: flex-start; }
  .step:hover { border-color: var(--teal-border); background: #FBFEFE; }
  .step:active { transform: translateY(1px); }
  .step.done { border-color: var(--teal-border); background: #F4FCFC; }
  .step-check { flex-shrink: 0; width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--line); background: var(--white); display: grid; place-items: center; transition: all .15s; margin-top: 1px; }
  .step.done .step-check { background: var(--teal); border-color: var(--teal); }
  .step-check svg { opacity: 0; transition: opacity .15s; }
  .step.done .step-check svg { opacity: 1; }
  .step-text { flex: 1; font-size: 14.5px; line-height: 1.6; color: var(--ink-2); }
  .step.done .step-text { color: var(--muted); text-decoration: line-through; text-decoration-color: rgba(74,85,104,.4); text-decoration-thickness: 1px; }
  code { font-family: 'SF Mono', Menlo, Consolas, monospace; background: var(--line-2); color: var(--navy); padding: 2px 7px; border-radius: 5px; font-size: 13px; font-weight: 600; border: 1px solid var(--line); }
  .step-text code { font-size: 12.5px; word-break: break-all; white-space: normal; }
  .callout-body code { font-size: 12.5px; }
  .field-table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: var(--radius-md); }
  .field-table { width: 100%; border-collapse: collapse; margin: 8px 0 18px; background: var(--white); border: 1px solid var(--line); border-radius: var(--radius-md); overflow: hidden; font-size: 13.5px; min-width: 380px; }
  .field-table th, .field-table td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
  .field-table thead th { background: var(--bg); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); font-weight: 800; }
  .field-table tr:last-child td { border-bottom: none; }
  .field-table td:first-child { font-weight: 700; color: var(--navy); white-space: nowrap; width: 28%; }
  .field-table td code { word-break: break-all; white-space: normal; }
  .callout { background: var(--teal-soft); border: 1px solid var(--teal-border); border-radius: var(--radius-md); padding: 26px 28px; position: sticky; top: 16px; }
  .callout::before { content: ''; display: block; width: 36px; height: 3px; background: var(--teal); border-radius: 2px; margin-bottom: 16px; }
  .callout-title { font-weight: 800; color: var(--navy); margin: 0 0 12px; font-size: 16px; letter-spacing: -0.2px; line-height: 1.3; }

  .callout-body strong { color: var(--navy); font-weight: 700; }

  .welcome { padding: 12px 0 0; }
  .welcome-hero { display: grid; grid-template-columns: 1.2fr 1fr; gap: 56px; align-items: center; margin-bottom: 36px; }
  .welcome-eyebrow { color: var(--teal-dark); font-size: 12px; text-transform: uppercase; letter-spacing: 2px; font-weight: 800; margin-bottom: 14px; }
  .welcome-title { font-size: 48px; line-height: 1.05; color: var(--navy); font-weight: 800; letter-spacing: -1.2px; margin: 0 0 20px; }
  .welcome-title em { color: var(--teal); font-style: normal; }
  .welcome-lead { font-size: 16px; color: var(--ink-2); line-height: 1.65; margin: 0 0 12px; }
  .welcome-side { background: linear-gradient(135deg, var(--navy) 0%, var(--navy-2) 100%); border-radius: var(--radius-md); padding: 26px 28px; color: rgba(255,255,255,.9); position: relative; overflow: hidden; }
  .welcome-side::before { content: ''; position: absolute; top: -40px; right: -40px; width: 160px; height: 160px; background: radial-gradient(circle, var(--teal) 0%, transparent 70%); opacity: .25; }
  .welcome-side h3 { color: var(--white); font-size: 14px; text-transform: uppercase; letter-spacing: 1.4px; margin: 0 0 14px; position: relative; }
  .welcome-side p { margin: 0 0 12px; font-size: 14.5px; line-height: 1.6; position: relative; }
  .welcome-side strong { color: var(--teal); }
  .caps-section { margin: 28px 0 12px; }
  .caps-heading { font-size: 13px; text-transform: uppercase; letter-spacing: 1.4px; color: var(--muted); font-weight: 800; margin-bottom: 16px; }
  .caps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; list-style: none; padding: 0; margin: 0; }
  .cap { display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; background: #F8FAFC; border: 1px solid var(--line); border-radius: var(--radius-sm); font-size: 13.5px; line-height: 1.45; color: var(--ink-2); }
  .cap-num { flex-shrink: 0; width: 22px; height: 22px; background: var(--teal); color: var(--white); border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 11px; }
  .completion { display: grid; grid-template-columns: 1fr 1fr; gap: 56px; align-items: center; padding: 20px 0; min-height: 480px; }
  .completion-left { display: flex; flex-direction: column; align-items: flex-start; }
  .completion-eyebrow { color: var(--teal-dark); font-size: 12px; text-transform: uppercase; letter-spacing: 2px; font-weight: 800; margin-bottom: 12px; }
  .completion-title { font-size: 44px; line-height: 1.05; color: var(--navy); font-weight: 800; margin: 0 0 16px; letter-spacing: -1px; }
  .completion-sub { color: var(--muted); margin: 0 0 24px; font-size: 16px; line-height: 1.6; }
  .completion-cta { display: flex; gap: 10px; flex-wrap: wrap; }
  .completion-right { background: linear-gradient(135deg, var(--teal-soft) 0%, #F4FCFC 100%); border: 1px solid var(--teal-border); border-radius: var(--radius-lg); padding: 32px; }
  .completion-right h3 { color: var(--navy); font-size: 14px; text-transform: uppercase; letter-spacing: 1.2px; margin: 0 0 18px; font-weight: 800; }
  .completion-checklist { list-style: none; padding: 0; margin: 0; }
  .completion-checklist li { display: flex; align-items: flex-start; gap: 10px; color: var(--ink-2); font-size: 14px; line-height: 1.5; margin-bottom: 10px; }
  .completion-checklist li::before { content: ''; flex-shrink: 0; width: 20px; height: 20px; background: var(--teal) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='20 6 9 17 4 12'/></svg>") center / 12px no-repeat; border-radius: 50%; margin-top: 1px; }
  .completion-prompt { background: var(--white); border: 1px solid var(--teal-border); border-radius: var(--radius-md); padding: 14px 16px; margin-top: 18px; font-family: 'SF Mono', Menlo, Consolas, monospace; font-size: 12.5px; color: var(--navy); line-height: 1.6; white-space: pre-wrap; word-break: break-word; max-height: 280px; overflow-y: auto; }
  .completion-prompt-label { font-family: var(--font); font-size: 10.5px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--teal-dark); font-weight: 800; margin-bottom: 6px; display: block; }
  .footer { border-top: 1px solid var(--line); padding: 16px 56px; display: flex; justify-content: space-between; align-items: center; gap: 16px; background: var(--white); }
  .btn { border: none; cursor: pointer; padding: 12px 22px; border-radius: 999px; font-weight: 700; font-size: 14px; font-family: var(--font); transition: background .15s, transform .1s, box-shadow .15s; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; }
  a.btn { text-decoration: none; }
  .btn:active { transform: translateY(1px); }
  .btn-primary { background: var(--teal); color: var(--white); box-shadow: 0 2px 8px rgba(8,164,165,.3); }
  .btn-primary:hover { background: var(--teal-dark); box-shadow: 0 4px 14px rgba(8,164,165,.4); }
  .btn-primary:disabled { background: #CBD5E0; color: var(--white); cursor: not-allowed; box-shadow: none; }
  .btn-ghost { background: transparent; color: var(--muted); padding: 12px 18px; }
  .btn-ghost:hover { color: var(--navy); background: var(--line-2); }
  .btn-ghost:disabled { color: #CBD5E0; cursor: not-allowed; background: transparent; }
  a.btn-ghost { border: 1px solid var(--line); }
  .step-progress { color: var(--muted); font-size: 13px; font-weight: 600; }
  .step-progress strong { color: var(--navy); }
  .phase-page { animation: fadeUp .35s ease; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @media (max-width: 1100px) { .phase-grid { grid-template-columns: 1fr; gap: 24px; } .callout { position: static; } .welcome-hero { grid-template-columns: 1fr; gap: 28px; } .welcome-title { font-size: 38px; } .completion { grid-template-columns: 1fr; gap: 28px; } .completion-title { font-size: 34px; } .caps { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 880px) { .somin-app { border-radius: 0; box-shadow: none; } .topbar { padding: 14px 18px; grid-template-columns: 1fr; gap: 14px; justify-items: center; } .stepper { width: 100%; max-width: none; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; } .stepper-dot { width: 26px; height: 26px; font-size: 10px; } .canvas-inner { padding: 28px 22px 16px; } .footer { padding: 14px 22px; } h1 { font-size: 26px; } .welcome-title { font-size: 30px; } .completion-title { font-size: 28px; } .top-progress { display: none; } .stepper-dot::before { display: none; } }
  @media (max-width: 560px) { .caps { grid-template-columns: 1fr; } .canvas-inner { padding: 24px 18px 12px; } .footer { padding: 12px 18px; } .btn { padding: 10px 16px; font-size: 13px; min-height: 44px; } .welcome-title { font-size: 26px; } .somin-app { min-height: unset; } h1 { font-size: 22px; } .intro { font-size: 15px; } .completion-title { font-size: 24px; } .phase-figcaption { padding: 0 8px; font-size: 12px; } }
</style>

<div class="somin-app" id="somin-app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">S</div>
      <div class="brand-text">
        <div class="brand-name">SOMIN &times; CLAUDE</div>
        <div class="brand-tag">MCP Connection Guide</div>
      </div>
    </div>
    <ol class="stepper" id="stepper"></ol>
    <div class="top-progress"><span><strong id="progressPct">0%</strong> complete</span></div>
  </header>
  <div class="canvas"><div class="canvas-inner" id="canvas"></div></div>
  <footer class="footer">
    <button class="btn btn-ghost" id="backBtn" disabled="">&larr; Back</button>
    <span class="step-progress" id="stepProgress">Step <strong>1</strong> of 7</span>
    <button class="btn btn-primary" id="nextBtn">Next &rarr;</button>
  </footer>
</div>

<script>
const CHECK_SVG = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#0A2540" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
const STEPPER_CHECK = CHECK_SVG;
const EXT_ICON = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>`;
const COPY_ICON = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;

function deepLink(url, label) {
  return `<a href="${url}" target="_blank" rel="noopener" class="deep-link-btn">${EXT_ICON} ${label}</a>`;
}

function copyVal(btn, val) {
  navigator.clipboard.writeText(val).then(() => {
    btn.classList.add('copied');
    const orig = btn.innerHTML;
    btn.innerHTML = COPY_ICON + ' Copied!';
    setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = orig; }, 1800);
  });
}

function copyBtn(value, label) {
  const escaped = value.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
  return `<button class="copy-btn" onclick="copyVal(this,'${escaped}')">${COPY_ICON} Copy ${label}</button>`;
}

const CLIENT_ID = 'e225a6ae05bdfd05eaf6372057519557';
const CLIENT_SECRET = 'c1cc83ef4e7748273a495b32525ee51bc9b6debf1143aa312482b92a486289c1be365a7b6ba8b799ebc5e55c9ab6884cfaa130cb2c747ff272b08e6377fc362c';
const MCP_URL = 'https://cloud.somin.ai/_mcp';
const SOMIN_LOGIN = 'https://cloud.somin.ai';
const CLAUDE_SETTINGS = 'https://claude.ai/settings/connectors';

const STORAGE_KEY = 'somin_claude_mcp_guide_v3';
const memStore = {};
function loadState() {
  try { const raw = localStorage.getItem(STORAGE_KEY); if (raw) return JSON.parse(raw); } catch(e) {}
  return memStore.state || { current: 0, doneSteps: {}, donePhases: {} };
}
function saveState(s) {
  memStore.state = s;
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); } catch(e) {}
}
let state = loadState();

function readDeepLink() {
  const params = new URLSearchParams(window.location.search);
  const stepParam = params.get('step');
  if (stepParam !== null) {
    const n = parseInt(stepParam, 10);
    if (!isNaN(n) && n >= 0 && n < PHASES.length) return n;
  }
  const hash = window.location.hash.replace('#','');
  if (hash) {
    const idx = PHASES.findIndex(p => p.id === hash);
    if (idx !== -1) return idx;
  }
  return null;
}

function updateURL(idx) {
  try {
    const phase = PHASES[idx];
    const url = new URL(window.location.href);
    url.searchParams.set('step', idx);
    url.hash = phase.id;
    history.replaceState(null, '', url.toString());
  } catch(e) {
    // silently ignore SecurityError in sandboxed environments
  }
}

function renderStepper() {
  const stepper = document.getElementById('stepper');
  stepper.innerHTML = '';
  PHASES.forEach((p, i) => {
    const li = document.createElement('li');
    li.className = 'stepper-item';
    if (i === state.current) li.classList.add('active');
    if (state.donePhases[p.id]) li.classList.add('complete');
    let label = p.type === 'welcome' ? '\u2605' : p.type === 'done' ? '\u2713' : String(p.number);
    li.innerHTML = `<button class="stepper-dot" data-label="${p.navTitle}" aria-label="${p.navTitle}"><span class="num-text">${label}</span><span class="checkmark">${STEPPER_CHECK}</span></button><span class="stepper-line"></span>`;
    li.querySelector('.stepper-dot').addEventListener('click', () => goTo(i));
    stepper.appendChild(li);
  });
  updateProgress();
}

function renderPhase() {
  const root = document.getElementById('canvas');
  const p = PHASES[state.current];
  const wrapper = document.createElement('div');
  wrapper.className = 'phase-page';

  if (p.type === 'welcome' || p.type === 'done') {
    wrapper.innerHTML = p.content;
  } else {
    let stepsHtml = '';
    if (p.steps && p.steps.length) {
      stepsHtml = '<h2>Action steps</h2><ul class="steps">';
      p.steps.forEach((s, idx) => {
        const stepKey = `${p.id}__${idx}`;
        const done = !!state.doneSteps[stepKey];
        stepsHtml += `<li class="step ${done ? 'done' : ''}" data-step-key="${stepKey}"><span class="step-check">${CHECK_SVG}</span><span class="step-text">${s}</span></li>`;
      });
      stepsHtml += '</ul>';
    }
    let calloutHtml = '';
    if (p.callout) {
      const eyebrow = p.callout.eyebrow ? `<div class="callout-eyebrow">${p.callout.eyebrow}</div>` : '';
      calloutHtml = `<aside class="callout">${eyebrow}<h3 class="callout-title">${p.callout.title}</h3><div class="callout-body">${p.callout.body}</div></aside>`;
    }
    let figureHtml = '';
    if (p.figures && p.figures.length) {
      const figs = p.figures.map(f => `<figure><div class="phase-figure-frame"><img src="${IMAGES[f.img]}" alt="${f.alt || ''}" loading="lazy" /></div><figcaption class="phase-figcaption"><strong>Figure</strong>${f.caption}</figcaption></figure>`).join('');
      const multiClass = p.figures.length > 1 ? ' phase-figure--multi' : '';
      figureHtml = `<div class="phase-figure${multiClass}">${figs}</div>`;
    }
    wrapper.innerHTML = `
      <div class="phase-header"><span class="phase-num">PHASE ${String(p.number).padStart(2,'0')}</span><span class="phase-counter">Phase ${p.number} of 5</span></div>
      <h1>${p.title}</h1>
      <p class="intro">${p.intro}</p>
      ${figureHtml}
      <div class="phase-grid"><div class="phase-main">${stepsHtml}</div><div class="phase-side">${calloutHtml}</div></div>
    `;
  }

  root.innerHTML = '';
  root.appendChild(wrapper);
  document.querySelector('.canvas').scrollTop = 0;
  updateURL(state.current);

  wrapper.querySelectorAll('.step').forEach(el => {
    el.addEventListener('click', (e) => {
      if (e.target.closest('a') || e.target.closest('button.copy-btn')) return;
      const key = el.dataset.stepKey;
      state.doneSteps[key] = !state.doneSteps[key];
      el.classList.toggle('done');
      checkPhaseComplete(p);
      saveState(state);
      updateProgress();
    });
  });

  const back = document.getElementById('backBtn');
  const next = document.getElementById('nextBtn');
  back.disabled = state.current === 0;
  if (state.current === PHASES.length - 1) {
    next.textContent = '\ud83c\udf89 Restart'; next.onclick = restart;
  } else {
    next.innerHTML = 'Next &rarr;'; next.onclick = next_;
  }
  document.getElementById('stepProgress').innerHTML = `Step <strong>${state.current + 1}</strong> of ${PHASES.length}`;
}

function checkPhaseComplete(p) {
  if (!p.steps || !p.steps.length) { state.donePhases[p.id] = true; return; }
  const allDone = p.steps.every((_, idx) => state.doneSteps[`${p.id}__${idx}`]);
  state.donePhases[p.id] = allDone;
}
function updateProgress() {
  const total = PHASES.filter(p => p.type === 'phase').length;
  let done = 0;
  PHASES.forEach(p => { if (p.type === 'phase' && state.donePhases[p.id]) done++; });
  const pct = total ? Math.round((done / total) * 100) : 0;
  document.getElementById('progressPct').textContent = pct + '%';
  document.querySelectorAll('.stepper-item').forEach((el, i) => {
    el.classList.toggle('complete', !!state.donePhases[PHASES[i].id]);
    el.classList.toggle('active', i === state.current);
  });
}
function goTo(i) {
  if (i < 0 || i >= PHASES.length) return;
  state.current = i;
  if (PHASES[i].type === 'welcome') state.donePhases[PHASES[i].id] = true;
  if (PHASES[i].type === 'done') state.donePhases[PHASES[i].id] = true;
  saveState(state); renderPhase(); updateProgress();
}
function next_() { goTo(state.current + 1); }
function back_() { goTo(state.current - 1); }
function restart() {
  try { localStorage.removeItem(STORAGE_KEY); } catch(e) {}
  memStore.state = null;
  state = { current: 0, doneSteps: {}, donePhases: {} };
  saveState(state); renderStepper(); renderPhase();
  const canvas = document.querySelector('.canvas');
  if (canvas) canvas.scrollTop = 0;
}

document.getElementById('backBtn').onclick = back_;
document.getElementById('nextBtn').onclick = next_;

const deepLinkIdx = readDeepLink();
if (deepLinkIdx !== null) state.current = deepLinkIdx;

renderStepper();
renderPhase();
</script>
